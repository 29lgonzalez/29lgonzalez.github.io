<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            Game Hub
            <span class="subtitle">
                By Luis Gonzalez, The Biggest Bird
            </span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home Page</a></li>
            <li><a href="GetToSchool7/index.html">Game Page</a></li>
            <li><a href="about.html">About Page</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Try To Start The Game</h1>

        <p class="main-text">
            Click the "Start Game" button below to begin.
            Good luck catching it.
        </p>

        <div class="game-box">
            <button id="startButton">
                Start Game
            </button>

            <p id="brokenMessage"></p>

        </div>

    </section>

    <script>

        let tries = 0;

        const button = document.getElementById("startButton");

        const isMobile =
            /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

        if (isMobile) {
            button.addEventListener("click", moveButton);
        }

        else {
            button.addEventListener("mouseover", moveButton);
        }

        function moveButton() {

            var gameBox = document.querySelector(".game-box");
            var message = document.getElementById("brokenMessage");

            button.style.transform = "none";

            var maxWidth = gameBox.clientWidth - button.offsetWidth;
            var maxHeight = gameBox.clientHeight - button.offsetHeight;

            var randomX = Math.random() * maxWidth;
            var randomY = Math.random() * maxHeight;

            button.style.left = randomX + "px";
            button.style.top = randomY + "px";

            tries++;

            if (tries >= 10) {

                message.innerHTML =
                    'uh ohh... you are too slow.<br>Maybe try the "Game Page" button on the navbar';

            }
        }

    </script>

    <footer>
        &copy; 2026
    </footer>

</body>

</html>
